[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-prediction-system"
version = "1.0.0"
description = "A reproducible end-to-end tabular machine learning training and inference system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["joblib>=1.3", "matplotlib>=3.7", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "seaborn>=0.13"]

[project.scripts]
ml-predict = "ml_prediction_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
